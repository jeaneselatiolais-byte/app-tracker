<title>App Development WBS / Project Plan Tracker</title>
<style>
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --bg-page: #F2F0EC;
  --bg-main: #FFFFFF;
  --bg-sidebar: #ECEAE5;
  --bg-surface: #F7F6F3;
  --bg-hover: #EDEAE4;
  --bg-danger: #FEF2F2;
  --bg-input: #FAFAF8;
  --txt-primary: #1C1917;
  --txt-secondary: #57534E;
  --txt-muted: #A8A29E;
  --txt-danger: #B91C1C;
  --bdr-light: rgba(0,0,0,0.08);
  --bdr-mid: rgba(0,0,0,0.14);
  --bdr-strong: rgba(0,0,0,0.24);
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --accent: #2563EB;
  --accent-hover: #1D4ED8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: var(--bg-page); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 20px 12px; }

.app-container { display: flex; min-height: 640px; border: 1px solid var(--bdr-light); border-radius: var(--radius-lg); overflow: hidden; background: var(--bg-main); width: 100%; max-width: 1100px; box-shadow: 0 4px 32px rgba(0,0,0,0.10); }

/* Sidebar */
.sidebar { width: 220px; min-width: 220px; background: var(--bg-sidebar); border-right: 1px solid var(--bdr-light); display: flex; flex-direction: column; }
.sidebar-header { padding: 16px 14px 11px; border-bottom: 1px solid var(--bdr-light); }
.sidebar-title { font-size: 10px; font-weight: 600; color: var(--txt-muted); letter-spacing: 0.08em; text-transform: uppercase; }
.sidebar-brand { font-size: 14px; font-weight: 700; color: var(--txt-primary); margin-top: 4px; }
.app-list { flex: 1; overflow-y: auto; padding: 8px; }
.app-item { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: var(--radius-md); cursor: pointer; margin-bottom: 2px; transition: background 0.12s; border: 1px solid transparent; }
.app-item:hover { background: var(--bg-hover); }
.app-item.active { background: var(--bg-main); border-color: var(--bdr-mid); }
.app-emoji { font-size: 18px; flex-shrink: 0; }
.app-info { flex: 1; min-width: 0; }
.app-name { font-size: 13px; font-weight: 600; color: var(--txt-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-prog { font-size: 11px; color: var(--txt-muted); margin-top: 1px; }
.del-btn { opacity: 0; font-size: 11px; background: none; border: none; cursor: pointer; padding: 2px 5px; border-radius: 4px; color: var(--txt-muted); flex-shrink: 0; }
.app-item:hover .del-btn { opacity: 1; }
.del-btn:hover { background: var(--bg-danger); color: var(--txt-danger); }
.add-btn { margin: 8px; padding: 9px 12px; background: none; border: 1px dashed var(--bdr-mid); border-radius: var(--radius-md); cursor: pointer; font-size: 12px; color: var(--txt-secondary); font-family: var(--font-sans); transition: all 0.12s; text-align: center; }
.add-btn:hover { background: var(--bg-main); color: var(--txt-primary); }

/* Main area */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 48px; }
.empty-icon { font-size: 40px; }
.empty-title { font-size: 17px; font-weight: 600; color: var(--txt-primary); }
.empty-sub { font-size: 13px; color: var(--txt-secondary); text-align: center; line-height: 1.55; max-width: 280px; }

/* App header */
.app-header { padding: 18px 22px 0; border-bottom: 1px solid var(--bdr-light); flex-shrink: 0; }
.app-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.app-big-name { font-size: 18px; font-weight: 700; color: var(--txt-primary); }
.app-meta { font-size: 12px; color: var(--txt-muted); margin-bottom: 12px; }
.app-meta span { margin-right: 12px; }
.overall-bar-wrap { margin-bottom: 14px; }
.overall-label { display: flex; justify-content: space-between; margin-bottom: 7px; }
.overall-label span:first-child { font-size: 12px; color: var(--txt-secondary); }
.overall-label span:last-child { font-size: 12px; font-weight: 600; color: var(--txt-primary); }
.bar-track { height: 6px; background: var(--bdr-light); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }

/* Phase tabs */
.phase-tabs { display: flex; overflow-x: auto; flex-shrink: 0; padding: 0 22px; background: var(--bg-surface); border-bottom: 1px solid var(--bdr-light); }
.phase-tab { padding: 8px 12px; font-size: 11px; font-weight: 600; color: var(--txt-muted); cursor: pointer; border: none; background: none; font-family: var(--font-sans); border-bottom: 2.5px solid transparent; white-space: nowrap; transition: all 0.15s; margin-bottom: -1px; letter-spacing: 0.01em; }
.phase-tab:hover { color: var(--txt-primary); }
.phase-tab.active { color: var(--txt-primary); border-bottom-color: var(--ph-color); }
.phase-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; border-radius: 8px; font-size: 9px; font-weight: 700; margin-left: 5px; padding: 0 4px; }

/* Content */
.content { flex: 1; overflow-y: auto; padding: 18px 22px; }
.phase-summary { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg-surface); border-radius: var(--radius-md); border: 1px solid var(--bdr-light); margin-bottom: 14px; }
.phase-summary-text { font-size: 13px; color: var(--txt-secondary); flex: 1; }
.phase-summary-text strong { color: var(--txt-primary); font-weight: 600; }
.phase-summary-count { font-size: 12px; font-weight: 600; }
.phase-duration { font-size: 11px; color: var(--txt-muted); margin-left: 8px; }

/* Section accordion */
.phase-section { margin-bottom: 8px; border: 1px solid var(--bdr-light); border-radius: var(--radius-md); overflow: hidden; }
.section-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg-surface); cursor: pointer; user-select: none; transition: background 0.12s; border: none; width: 100%; text-align: left; font-family: var(--font-sans); }
.section-header:hover { background: var(--bg-hover); }
.section-title { font-size: 12px; font-weight: 600; color: var(--txt-primary); flex: 1; }
.section-meta { font-size: 11px; color: var(--txt-muted); font-weight: 500; }
.section-chevron { width: 14px; height: 14px; flex-shrink: 0; transition: transform 0.2s ease; color: var(--txt-muted); }
.section-chevron.open { transform: rotate(90deg); }
.section-items { border-top: 1px solid var(--bdr-light); overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
.section-items.open { max-height: 8000px; }

/* Task row */
.task-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--bdr-light); transition: background 0.1s; }
.task-row:last-child { border-bottom: none; }
.task-row:hover { background: var(--bg-surface); }
.task-check { width: 17px; height: 17px; min-width: 17px; border-radius: 5px; border: 1.5px solid var(--bdr-mid); background: none; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; cursor: pointer; }
.task-main { flex: 1; min-width: 0; }
.task-text { font-size: 13px; color: var(--txt-primary); line-height: 1.5; cursor: pointer; }
.task-text.done { color: var(--txt-muted); text-decoration: line-through; }
.task-details { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; align-items: center; }
.task-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--bg-surface); border: 1px solid var(--bdr-light); color: var(--txt-secondary); }
.task-pill.duration { background: #EFF6FF; color: #1E40AF; border-color: #BFDBFE; }
.task-pill.dept { background: #F0FDF4; color: #166534; border-color: #BBF7D0; }
.task-pill.has-cred { background: #FEF3C7; color: #92400E; border-color: #FDE68A; cursor: pointer; }
.task-pill.has-note { background: #F3E8FF; color: #6B21A8; border-color: #DDD6FE; cursor: pointer; }
.task-actions { display: flex; gap: 4px; flex-shrink: 0; margin-top: 2px; }
.task-action-btn { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); border: 1px solid var(--bdr-light); background: var(--bg-main); cursor: pointer; font-size: 12px; color: var(--txt-muted); transition: all 0.12s; }
.task-action-btn:hover { background: var(--bg-surface); color: var(--txt-primary); border-color: var(--bdr-mid); }
.task-action-btn.active { background: #EFF6FF; color: #2563EB; border-color: #93C5FD; }

/* Modal overlay */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: var(--bg-main); border: 1px solid var(--bdr-mid); border-radius: var(--radius-lg); padding: 24px; width: 420px; max-width: 95vw; box-shadow: 0 8px 40px rgba(0,0,0,0.18); max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 16px; font-weight: 700; color: var(--txt-primary); margin-bottom: 6px; }
.modal-subtitle { font-size: 13px; color: var(--txt-secondary); margin-bottom: 18px; line-height: 1.5; }
.modal-field { margin-bottom: 14px; }
.modal-label { font-size: 12px; color: var(--txt-secondary); margin-bottom: 6px; display: block; font-weight: 600; }
.modal input, .modal select, .modal textarea { width: 100%; padding: 9px 11px; font-size: 13px; font-family: var(--font-sans); color: var(--txt-primary); background: var(--bg-input); border: 1px solid var(--bdr-mid); border-radius: var(--radius-md); outline: none; transition: border 0.15s; }
.modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--accent); }
.modal textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.modal-actions { display: flex; gap: 9px; margin-top: 20px; }
.btn-cancel { flex: 1; padding: 10px; background: none; border: 1px solid var(--bdr-mid); border-radius: var(--radius-md); font-size: 13px; font-family: var(--font-sans); color: var(--txt-secondary); cursor: pointer; font-weight: 500; }
.btn-cancel:hover { background: var(--bg-surface); }
.btn-primary { flex: 1; padding: 10px; background: var(--accent); border: none; border-radius: var(--radius-md); font-size: 13px; font-family: var(--font-sans); color: white; cursor: pointer; font-weight: 600; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

/* Wizard */
.wizard { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
.wizard-card { width: 100%; max-width: 440px; }
.wizard-step { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.wizard-title { font-size: 20px; font-weight: 700; color: var(--txt-primary); margin-bottom: 6px; }
.wizard-sub { font-size: 13px; color: var(--txt-secondary); margin-bottom: 24px; line-height: 1.55; }
.wizard-field { margin-bottom: 16px; }
.wizard-field label { font-size: 12px; font-weight: 600; color: var(--txt-secondary); margin-bottom: 6px; display: block; }
.wizard-field input, .wizard-field select, .wizard-field textarea { width: 100%; padding: 10px 12px; font-size: 14px; font-family: var(--font-sans); color: var(--txt-primary); background: var(--bg-input); border: 1px solid var(--bdr-mid); border-radius: var(--radius-md); outline: none; }
.wizard-field input:focus, .wizard-field select:focus, .wizard-field textarea:focus { border-color: var(--accent); }
.wizard-field textarea { resize: vertical; min-height: 80px; }
.wizard-field .hint { font-size: 11px; color: var(--txt-muted); margin-top: 4px; }
.wizard-actions { display: flex; gap: 10px; margin-top: 24px; }
.wizard-actions button { padding: 11px 24px; border-radius: var(--radius-md); font-size: 14px; font-family: var(--font-sans); font-weight: 600; cursor: pointer; transition: all 0.12s; }
.wizard-next { background: var(--accent); border: none; color: white; flex: 1; }
.wizard-next:hover { background: var(--accent-hover); }
.wizard-next:disabled { opacity: 0.4; cursor: not-allowed; }
.wizard-back { background: none; border: 1px solid var(--bdr-mid); color: var(--txt-secondary); }
.wizard-back:hover { background: var(--bg-surface); }

/* Password visibility */
.pw-field { position: relative; }
.pw-field input { padding-right: 36px; }
.pw-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 14px; color: var(--txt-muted); padding: 4px; }

/* Export button */
.export-btn { padding: 6px 12px; font-size: 11px; background: var(--bg-surface); border: 1px solid var(--bdr-light); border-radius: var(--radius-sm); cursor: pointer; color: var(--txt-secondary); font-family: var(--font-sans); font-weight: 500; }
.export-btn:hover { background: var(--bg-hover); color: var(--txt-primary); }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { width: 180px; min-width: 180px; }
  .app-container { min-height: auto; }
}
</style>
</head>

<script>

// ─── WBS Phase & Task Definitions ───
function buildPhases(appData) {
  const name = appData.name || 'My App';
  return [
    { id:'validation', phase:'1 · Name Validation', days:'Week 1', color:'#7C3AED', dept:'PM / Legal',
      sections:[
        { title:'App Name Research', items:[
          {id:'v1',text:`Search Apple App Store for "${name}" and similar names`,duration:'2h',dept:'PM'},
          {id:'v2',text:'Search USPTO trademark database for conflicts',duration:'2h',dept:'Legal'},
          {id:'v3',text:'Search Google Play Store for cross-platform conflicts',duration:'1h',dept:'PM'},
          {id:'v4',text:'Check domain availability (.com, .app, .io)',duration:'30m',dept:'PM'},
          {id:'v5',text:'Search social media handles availability (X, IG, TikTok)',duration:'1h',dept:'Marketing'},
          {id:'v6',text:'Document all findings in validation report',duration:'2h',dept:'PM'},
          {id:'v7',text:'Go / No-Go decision on app name',duration:'1h',dept:'PM / Stakeholders'},
        ]},
        { title:'Name Finalization', items:[
          {id:'v8',text:'Finalize official app name (30 char max for App Store)',duration:'1h',dept:'PM / Branding'},
          {id:'v9',text:'Create name style guide (capitalization, spacing)',duration:'1h',dept:'Branding'},
          {id:'v10',text:'File trademark application (if applicable)',duration:'4h',dept:'Legal'},
        ]},
      ]
    },
    { id:'identity', phase:'2 · Domain & Identity', days:'Week 2', color:'#0D9488', dept:'PM / Marketing',
      sections:[
        { title:'Domain & Email Setup', items:[
          {id:'d1',text:'Purchase primary domain name',duration:'30m',dept:'PM',hasCred:true},
          {id:'d2',text:'Purchase alternate domain extensions (.app, .io)',duration:'30m',dept:'PM',hasCred:true},
          {id:'d3',text:'Configure DNS records',duration:'1h',dept:'Dev'},
          {id:'d4',text:'Set up professional email (hello@, support@, press@)',duration:'1h',dept:'PM',hasCred:true},
          {id:'d5',text:'Configure email forwarding and signatures',duration:'30m',dept:'PM'},
        ]},
        { title:'Social Media Setup', items:[
          {id:'d6',text:'Create X (Twitter) account and optimize profile',duration:'1h',dept:'Marketing',hasCred:true},
          {id:'d7',text:'Create Instagram account with branded bio',duration:'1h',dept:'Marketing',hasCred:true},
          {id:'d8',text:'Create TikTok account',duration:'1h',dept:'Marketing',hasCred:true},
          {id:'d9',text:'Create YouTube channel',duration:'1h',dept:'Marketing',hasCred:true},
          {id:'d10',text:'Create LinkedIn company page',duration:'1h',dept:'Marketing',hasCred:true},
          {id:'d11',text:'Set up link-in-bio tool (Linktree, etc.)',duration:'30m',dept:'Marketing',hasCred:true},
          {id:'d12',text:'Create consistent branding across all platforms',duration:'2h',dept:'Branding'},
        ]},
      ]
    },
    { id:'requirements', phase:'3 · Requirements', days:'Weeks 3–4', color:'#2563EB', dept:'PM / Dev',
      sections:[
        { title:'Business Requirements', items:[
          {id:'r1',text:'Define target audience and user personas',duration:'4h',dept:'PM / Marketing'},
          {id:'r2',text:'Write problem statement and value proposition',duration:'2h',dept:'PM'},
          {id:'r3',text:'Define business model and monetization strategy',duration:'3h',dept:'PM'},
          {id:'r4',text:'Competitive analysis (top 5 competitors)',duration:'4h',dept:'PM / Marketing'},
          {id:'r5',text:'Define success metrics and KPIs',duration:'2h',dept:'PM'},
        ]},
        { title:'Functional Requirements', items:[
          {id:'r6',text:'Write user stories with acceptance criteria',duration:'8h',dept:'PM / Dev'},
          {id:'r7',text:'Create functional requirements document (FRD)',duration:'6h',dept:'PM'},
          {id:'r8',text:'Define data models and schema',duration:'4h',dept:'Dev'},
          {id:'r9',text:'Define API requirements and integrations',duration:'4h',dept:'Dev'},
          {id:'r10',text:'Define authentication and authorization requirements',duration:'2h',dept:'Dev'},
        ]},
        { title:'Non-Functional & MVP Scoping', items:[
          {id:'r11',text:'Define performance requirements (load times, etc.)',duration:'2h',dept:'Dev'},
          {id:'r12',text:'Define security requirements and data privacy',duration:'3h',dept:'Dev / Legal'},
          {id:'r13',text:'Define accessibility requirements (WCAG)',duration:'2h',dept:'Dev / Design'},
          {id:'r14',text:'Define device and iOS version support matrix',duration:'1h',dept:'Dev'},
          {id:'r15',text:'Prioritize features: Must-have vs Nice-to-have',duration:'3h',dept:'PM / Dev'},
          {id:'r16',text:'Define MVP scope and release strategy',duration:'4h',dept:'PM / Stakeholders'},
          {id:'r17',text:'Create product backlog in project management tool',duration:'3h',dept:'PM'},
          {id:'r18',text:'Requirements sign-off from stakeholders',duration:'2h',dept:'PM / Stakeholders'},
        ]},
      ]
    },
    { id:'design', phase:'4 · UI/UX Design', days:'Weeks 5–7', color:'#D946EF', dept:'Design / Marketing',

          {id:'u7',text:'Design app icon (1024×1024px + all sizes)',duration:'6h',dept:'Branding / Design'},

        { title:'Prototype & Review', items:[

          {id:'u13',text:'Conduct design review with Marketing team',duration:'2h',dept:'Design / Marketing'},
          {id:'u14',text:'Conduct design review with Branding team',duration:'2h',dept:'Design / Branding'},
          {id:'u15',text:'Incorporate feedback and finalize designs',duration:'4h',dept:'Design'},
          {id:'u16',text:'Export design specs and assets for development',duration:'3h',dept:'Design'},

    { id:'develop', phase:'5 · Development', days:'Weeks 8–14', color:'#16A34A', dept:'Dev',
      sections:[
        { title:'Environment & Architecture', items:[

// ─── State ───
let state = {
  apps: [],
  selectedId: null,
  activePhase: 'validation',
  checks: {},
  notes: {},
  creds: {},
  collapsed: {},
  showWizard: false,
  wizardStep: 0,
  wizardData: { name:'', category:'', subcategory:'', concept:'' },
  modal: null, // { type:'note'|'cred', appId, taskId }
  modalData: {},
};

function save() {
  try {
    const d = { apps: state.apps, checks: state.checks, notes: state.notes, creds: state.creds, collapsed: state.collapsed };
    localStorage.setItem('wbs_tracker_v2', JSON.stringify(d));
  } catch(e){}
}

function load() {
  try {
    const raw = localStorage.getItem('wbs_tracker_v2');
    if (raw) {
      const d = JSON.parse(raw);
      state.apps = d.apps || [];
      state.checks = d.checks || {};
      state.notes = d.notes || {};
      state.creds = d.creds || {};
      state.collapsed = d.collapsed || {};
    }
  } catch(e){}
}

// ─── Helpers ───
function getPhases(app) { return buildPhases(app); }
function getAllIds(app) { return getPhases(app).flatMap(p=>p.sections.flatMap(s=>s.items.map(i=>i.id))); }
function getTotal(appId) {
  const app = state.apps.find(a=>a.id===appId);
  if (!app) return {checked:0,total:0};
  const ids = getAllIds(app);
  return { checked: ids.filter(id=>state.checks[appId+'-'+id]).length, total: ids.length };
}
function getPhaseProgress(appId, phaseId) {
  const app = state.apps.find(a=>a.id===appId);
  if (!app) return {checked:0,total:0};
  const phase = getPhases(app).find(p=>p.id===phaseId);
  if (!phase) return {checked:0,total:0};
  const items = phase.sections.flatMap(s=>s.items);
  return { checked: items.filter(i=>state.checks[appId+'-'+i.id]).length, total: items.length };
}
function pct(n,t) { return t===0?0:Math.round((n/t)*100); }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function chevron(open) {
  return `<svg class="section-chevron ${open?'open':''}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 3 11 8 6 13"/></svg>`;
}

// ─── Actions ───
function selectApp(id) { state.selectedId = id; state.activePhase = 'validation'; render(); }
function delApp(id) {
  if (!confirm('Delete this app project and all its data?')) return;
  state.apps = state.apps.filter(a=>a.id!==id);
  Object.keys(state.checks).filter(k=>k.startsWith(id+'-')).forEach(k=>delete state.checks[k]);
  Object.keys(state.notes).filter(k=>k.startsWith(id+'-')).forEach(k=>delete state.notes[k]);
  Object.keys(state.creds).filter(k=>k.startsWith(id+'-')).forEach(k=>delete state.creds[k]);
  if (state.selectedId === id) state.selectedId = state.apps[0]?.id || null;
  save(); render();
}
function setPhase(id) { state.activePhase = id; render(); }
function toggle(key) { state.checks[key] = !state.checks[key]; save(); render(); }
function toggleSection(appId, phaseId, secTitle) {
  const k = appId+'|'+phaseId+'|'+secTitle;
  state.collapsed[k] = !state.collapsed[k]; save(); render();
}
function isSectionOpen(appId, phaseId, secTitle) {
  return state.collapsed[appId+'|'+phaseId+'|'+secTitle] !== true;
}

// Wizard
function openWizard() { state.showWizard = true; state.wizardStep = 0; state.wizardData = {name:'',category:'',subcategory:'',concept:''}; render(); }
function closeWizard() { state.showWizard = false; render(); }
function wizardNext() {
  if (state.wizardStep < 2) { state.wizardStep++; render(); }
  else { createAppFromWizard(); }
}
function wizardBack() { if (state.wizardStep > 0) { state.wizardStep--; render(); } }
function createAppFromWizard() {
  const d = state.wizardData;
  const app = {
    id: 'app_' + Date.now(),
    name: d.name,
    category: d.category,
    subcategory: d.subcategory,
    concept: d.concept,
    created: new Date().toISOString().split('T')[0],
  };
  state.apps.push(app);
  state.selectedId = app.id;
  state.activePhase = 'validation';
  state.showWizard = false;
  save(); render();
}

// Notes modal
function openNoteModal(appId, taskId) {
  const key = appId+'-'+taskId;
  state.modal = { type:'note', appId, taskId };
  state.modalData = { note: state.notes[key] || '' };
  render();
}
function saveNote() {
  const key = state.modal.appId+'-'+state.modal.taskId;
  state.notes[key] = state.modalData.note || '';
  if (!state.notes[key]) delete state.notes[key];
  state.modal = null;
  save(); render();
}

// Credentials modal
function openCredModal(appId, taskId) {
  const key = appId+'-'+taskId;
  const existing = state.creds[key] || {};
  state.modal = { type:'cred', appId, taskId };
  state.modalData = { username: existing.username || '', password: existing.password || '', url: existing.url || '', showPw: false };
  render();
}
function saveCred() {
  const key = state.modal.appId+'-'+state.modal.taskId;
  const d = state.modalData;
  if (d.username || d.password || d.url) {
    state.creds[key] = { username: d.username, password: d.password, url: d.url };
  } else {
    delete state.creds[key];
  }
  state.modal = null;
  save(); render();
}
function closeModal() { state.modal = null; render(); }

// ─── Render ───
function render() {
  const root = document.getElementById('root');
  const app = state.apps.find(a=>a.id===state.selectedId);
  const phases = app ? getPhases(app) : [];
  const phase = phases.find(p=>p.id===state.activePhase);

  // Sidebar
  const sidebarItems = state.apps.map(a => {
    const {checked,total} = getTotal(a.id);
    return `<div class="app-item ${a.id===state.selectedId?'active':''}" onclick="selectApp('${a.id}')">
      <span class="app-emoji">📱</span>
      <div class="app-info"><div class="app-name">${esc(a.name)}</div><div class="app-prog">${pct(checked,total)}% complete · ${checked}/${total}</div></div>
      <button class="del-btn" onclick="event.stopPropagation();delApp('${a.id}')">✕</button>
    </div>`;
  }).join('') || '<div style="padding:14px 10px;font-size:12px;color:var(--txt-muted)">No projects yet</div>';

  // Main content
  let mainContent = '';
  if (state.showWizard) {
    mainContent = renderWizard();
  } else if (!app) {
    mainContent = `<div class="empty-state">
      <div class="empty-icon">📋</div>
      <div class="empty-title">No project selected</div>
      <div class="empty-sub">Click "+ New App Project" to start your comprehensive WBS tracking from concept through 90-day post-launch.</div>
    </div>`;
  } else {
    const {checked:tc,total:tt} = getTotal(app.id);
    const barColor = phase?.color || '#2563EB';
    const {checked:phC,total:phT} = getPhaseProgress(app.id, state.activePhase);

    const phaseTabs = phases.map(ph => {
      const {checked:pc,total:pt} = getPhaseProgress(app.id, ph.id);
      const done = pc===pt;
      return `<button class="phase-tab ${ph.id===state.activePhase?'active':''}" style="--ph-color:${ph.color}" onclick="setPhase('${ph.id}')">
        ${ph.phase}<span class="phase-badge" style="background:${done?ph.color+'22':'var(--bdr-light)'};color:${done?ph.color:'var(--txt-muted)'}">${pc}/${pt}</span>
      </button>`;
    }).join('');

    const sections = (phase?.sections || []).map(sec => {
      const open = isSectionOpen(app.id, state.activePhase, sec.title);
      const secChecked = sec.items.filter(i=>state.checks[app.id+'-'+i.id]).length;
      const escapedTitle = sec.title.replace(/'/g,"\\'");

      const items = sec.items.map(item => {
        const key = app.id+'-'+item.id;
        const done = !!state.checks[key];
        const hasNote = !!state.notes[key];
        const hasCred = !!state.creds[key];
        const wantsCred = item.hasCred;

        let pills = '';
        if (item.duration) pills += `<span class="task-pill duration">⏱ ${item.duration}</span>`;
        if (item.dept) pills += `<span class="task-pill dept">${esc(item.dept)}</span>`;
        if (hasCred) pills += `<span class="task-pill has-cred" onclick="event.stopPropagation();openCredModal('${app.id}','${item.id}')">🔑 Saved</span>`;
        if (hasNote) pills += `<span class="task-pill has-note" onclick="event.stopPropagation();openNoteModal('${app.id}','${item.id}')">📝 Note</span>`;

        let actions = `<button class="task-action-btn ${hasNote?'active':''}" onclick="event.stopPropagation();openNoteModal('${app.id}','${item.id}')" title="Notes">📝</button>`;
        if (wantsCred) {
          actions += `<button class="task-action-btn ${hasCred?'active':''}" onclick="event.stopPropagation();openCredModal('${app.id}','${item.id}')" title="Credentials">🔑</button>`;
        }

        return `<div class="task-row">
          <div class="task-check" onclick="toggle('${key}')" style="${done?'background:'+phase.color+';border-color:'+phase.color:''}">
            ${done?'<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5 5 4 7.5 8.5 2.5"/></svg>':''}
          </div>
          <div class="task-main">
            <span class="task-text ${done?'done':''}" onclick="toggle('${key}')">${esc(item.text)}</span>
            <div class="task-details">${pills}</div>
          </div>
          <div class="task-actions">${actions}</div>
        </div>`;
      }).join('');

      return `<div class="phase-section">
        <button class="section-header" onclick="toggleSection('${app.id}','${state.activePhase}','${escapedTitle}')">
          ${chevron(open)}<span class="section-title">${esc(sec.title)}</span>
          <span class="section-meta">${secChecked} / ${sec.items.length}</span>
        </button>
        <div class="section-items ${open?'open':''}">${items}</div>
      </div>`;
    }).join('');

    mainContent = `
      <div class="app-header">
        <div class="app-title-row">
          <span class="app-big-name">📱 ${esc(app.name)}</span>
        </div>
        <div class="app-meta">
          <span>📁 ${esc(app.category)}${app.subcategory?' / '+esc(app.subcategory):''}</span>
          <span>📅 Created ${app.created}</span>
        </div>
        <div class="overall-bar-wrap">
          <div class="overall-label"><span>Overall Progress</span><span>${tc} / ${tt} tasks · ${pct(tc,tt)}%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct(tc,tt)}%;background:${barColor}"></div></div>
        </div>
      </div>
      <div class="phase-tabs">${phaseTabs}</div>
      <div class="content">
        <div class="phase-summary">
          <span class="phase-summary-text"><strong>${esc(phase?.phase||'')}</strong>&nbsp; · &nbsp;${esc(phase?.days||'')}</span>
          <span class="phase-summary-count" style="color:${phase?.color||'#2563EB'}">${phC} / ${phT} done</span>
        </div>
        ${sections}
      </div>`;
  }

  // Modal
  let modalHtml = '';
  if (state.modal) {
    if (state.modal.type === 'note') {
      modalHtml = `<div class="modal-overlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-title">📝 Task Notes</div>
          <div class="modal-field">
            <label class="modal-label">Notes</label>
            <textarea id="noteInput" placeholder="Add notes, links, reminders...">${esc(state.modalData.note)}</textarea>
          </div>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" onclick="state.modalData.note=document.getElementById('noteInput').value;saveNote()">Save Note</button>
          </div>
        </div>
      </div>`;
    } else if (state.modal.type === 'cred') {
      const showPw = state.modalData.showPw;
      modalHtml = `<div class="modal-overlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-title">🔑 Credentials</div>
          <div class="modal-subtitle">Store login details for this task. Data is saved locally in your browser.</div>
          <div class="modal-field">
            <label class="modal-label">URL / Service</label>
            <input id="credUrl" type="text" value="${esc(state.modalData.url)}" placeholder="https://example.com" />
          </div>
          <div class="modal-field">
            <label class="modal-label">Username / Email</label>
            <input id="credUser" type="text" value="${esc(state.modalData.username)}" placeholder="user@example.com" />
          </div>
          <div class="modal-field">
            <label class="modal-label">Password</label>
            <div class="pw-field">
              <input id="credPass" type="${showPw?'text':'password'}" value="${esc(state.modalData.password)}" placeholder="••••••••" />
              <button class="pw-toggle" onclick="state.modalData.showPw=!state.modalData.showPw;state.modalData.username=document.getElementById('credUser').value;state.modalData.password=document.getElementById('credPass').value;state.modalData.url=document.getElementById('credUrl').value;render()">${showPw?'🙈':'👁'}</button>
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" onclick="state.modalData.username=document.getElementById('credUser').value;state.modalData.password=document.getElementById('credPass').value;state.modalData.url=document.getElementById('credUrl').value;saveCred()">Save Credentials</button>
          </div>
        </div>
      </div>`;
    }
  }

  root.innerHTML = `
    <div class="app-container">
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title">App Projects</div>
          <div class="sidebar-brand">WBS Tracker</div>
        </div>
        <div class="app-list">${sidebarItems}</div>
        <button class="add-btn" onclick="openWizard()">+ New App Project</button>
      </div>
      <div class="main">${mainContent}</div>
    </div>
    ${modalHtml}`;
}

function renderWizard() {
  const step = state.wizardStep;
  const d = state.wizardData;

  if (step === 0) {
    return `<div class="wizard"><div class="wizard-card">
      <div class="wizard-step">Step 1 of 3</div>
      <div class="wizard-title">What's your app called?</div>
      <div class="wizard-sub">Enter a potential name for your app. We'll validate it for uniqueness and conflicts in the first phase of the project.</div>
      <div class="wizard-field">
        <label>Potential App Name</label>
        <input id="wName" type="text" value="${esc(d.name)}" placeholder="e.g., FocusFlow, MealPlanr, BudgetBee" maxlength="30" oninput="state.wizardData.name=this.value;document.querySelector('.wizard-next').disabled=!this.value.trim()" />
        <div class="hint">Apple App Store allows max 30 characters for the app name.</div>
      </div>
      <div class="wizard-actions">
        <button class="btn-cancel" onclick="closeWizard()">Cancel</button>
        <button class="wizard-next" ${d.name.trim()?'':'disabled'} onclick="wizardNext()">Next →</button>
      </div>
    </div></div>`;
  }

  if (step === 1) {
    const cats = Object.keys(APPLE_CATEGORIES);
    const catOptions = cats.map(c=>`<option value="${c}" ${d.category===c?'selected':''}>${c}</option>`).join('');
    const subs = d.category ? APPLE_CATEGORIES[d.category] || [] : [];
    const subOptions = subs.length
      ? subs.map(s=>`<option value="${s}" ${d.subcategory===s?'selected':''}>${s}</option>`).join('')
      : '<option value="">No subcategories</option>';

    return `<div class="wizard"><div class="wizard-card">
      <div class="wizard-step">Step 2 of 3</div>
      <div class="wizard-title">App Store Category</div>
      <div class="wizard-sub">Select the primary Apple App Store category and optional subcategory for your app.</div>
      <div class="wizard-field">
        <label>Primary Category</label>
        <select id="wCat" onchange="state.wizardData.category=this.value;state.wizardData.subcategory='';render()">
          <option value="">Select a category...</option>
          ${catOptions}
        </select>
      </div>
      ${subs.length ? `<div class="wizard-field">
        <label>Subcategory (Optional)</label>
        <select id="wSub" onchange="state.wizardData.subcategory=this.value">
          <option value="">None</option>
          ${subOptions}
        </select>
      </div>` : ''}
      <div class="wizard-actions">
        <button class="wizard-back" onclick="wizardBack()">← Back</button>
        <button class="wizard-next" ${d.category?'':'disabled'} onclick="wizardNext()">Next →</button>
      </div>
    </div></div>`;
  }

  if (step === 2) {
    return `<div class="wizard"><div class="wizard-card">
      <div class="wizard-step">Step 3 of 3</div>
      <div class="wizard-title">High-Level Concept</div>
      <div class="wizard-sub">Describe your app idea in a few sentences. What problem does it solve? Who is it for? This helps contextualize every phase of the project plan.</div>
      <div class="wizard-field">
        <label>App Concept</label>
        <textarea id="wConcept" placeholder="e.g., A meal planning app for busy parents that suggests quick recipes based on what's in the fridge, generates shopping lists, and tracks nutrition goals." oninput="state.wizardData.concept=this.value;document.querySelector('.wizard-next').disabled=!this.value.trim()">${esc(d.concept)}</textarea>
      </div>
      <div style="margin-top:16px;padding:14px;background:var(--bg-surface);border-radius:var(--radius-md);border:1px solid var(--bdr-light)">
        <div style="font-size:12px;font-weight:600;color:var(--txt-primary);margin-bottom:8px">Project Summary</div>
        <div style="font-size:12px;color:var(--txt-secondary);line-height:1.6">
          <strong>Name:</strong> ${esc(d.name)}<br/>
          <strong>Category:</strong> ${esc(d.category)}${d.subcategory?' / '+esc(d.subcategory):''}<br/>
          <strong>Phases:</strong> 12 phases · 150+ tasks · Name validation through 90-day post-launch
        </div>
      </div>
      <div class="wizard-actions">
        <button class="wizard-back" onclick="wizardBack()">← Back</button>
        <button class="wizard-next" ${d.concept.trim()?'':'disabled'} onclick="wizardNext()">Create Project →</button>
      </div>
    </div></div>`;
  }
}

// ─── Init ───
load();
render();
</script>


</body></html>
